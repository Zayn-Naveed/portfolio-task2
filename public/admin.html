<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel | Zain Naveed Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">Admin Panel</div>
    <ul class="nav-links">
      <li><a href="index.html">← Back to Site</a></li>
    </ul>
  </nav>

  <!-- ADMIN SECTION -->
  <section class="admin-section">
    <h1>Team Management</h1>
    <p class="section-subtitle">Add, edit or delete team members</p>

    <!-- ADD MEMBER FORM -->
    <div class="admin-form-container">
      <h2 id="formTitle">Add New Member</h2>
      <div class="admin-form">

        <input type="hidden" id="memberId"/>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="memberName" placeholder="Enter full name"/>
        </div>

        <div class="form-group">
          <label>Role</label>
          <input type="text" id="memberRole" placeholder="e.g. Frontend Developer"/>
        </div>

        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="memberImage" placeholder="https://..."/>
        </div>

        <div class="form-group">
          <label>Bio</label>
          <textarea id="memberBio" placeholder="Short description..." rows="3"></textarea>
        </div>

        <div class="form-group">
          <label>LinkedIn URL</label>
          <input type="text" id="memberLinkedin" placeholder="https://linkedin.com/in/..."/>
        </div>

        <div class="form-group">
          <label>GitHub URL</label>
          <input type="text" id="memberGithub" placeholder="https://github.com/..."/>
        </div>

        <div class="form-buttons">
          <button id="submitBtn" onclick="submitMember()">Add Member</button>
          <button id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button>
        </div>

      </div>
    </div>

    <!-- TEAM MEMBERS LIST -->
    <div class="admin-list-container">
      <h2>Current Team Members</h2>
      <div id="adminTeamList">
        <!-- Members loaded here -->
      </div>
    </div>

  </section>

  <script src="admin.js"></script>
</body>
</html>
